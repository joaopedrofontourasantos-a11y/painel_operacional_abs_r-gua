<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Operacional — Régua EPS e ABS Próprio</title>
<style>
:root{--vero:#D63066;--bordo-escuro:#890038;--bordo:#BF0045;--rosa:#FA6B91;--amarelo:#FFD31B;--line:#f0ccda;--bg:#fff7fa;--ink:#241638;--muted:#6f6476}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);display:flex;flex-direction:column}

.tabs{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#fff;border-bottom:3px solid var(--bordo);flex-wrap:wrap}
.tabs b{color:var(--bordo-escuro);font-size:13px;margin-right:6px}
.tab{border:0;border-radius:999px;padding:10px 18px;font:bold 13px Arial,Helvetica,sans-serif;background:#fce5ed;color:var(--bordo-escuro);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tab:hover{filter:brightness(.97)}.tab.on{background:var(--bordo);color:#fff}

.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.role{font-weight:bold;border-radius:99px;padding:4px 10px;font-size:11px}.role.ed{background:#d9f2e8;color:#126b51}.role.vi{background:#fff0c2;color:#765100}
.lbtn{border:0;border-radius:8px;padding:8px 12px;font:bold 12px Arial;background:#f8d7e3;color:var(--bordo-escuro);cursor:pointer}
.stage{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.flash{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;max-width:92vw;padding:11px 16px;border-radius:10px;font-weight:bold;font-size:13px;color:#fff;background:#126b51;box-shadow:0 6px 20px #0003}.flash.err{background:#9c102d}
.login{position:fixed;inset:0;z-index:40;background:linear-gradient(110deg,var(--bordo-escuro),var(--bordo),var(--vero));display:flex;align-items:center;justify-content:center;padding:16px}
.lcard{background:#fff;border-radius:14px;padding:26px;width:100%;max-width:380px;box-shadow:0 12px 40px #0004}
.lcard h1{font-size:20px;margin:0 0 4px;color:var(--bordo-escuro)}.lcard p{margin:0 0 16px;font-size:12px;color:var(--muted)}
.lcard label{display:block;font-size:11px;font-weight:bold;color:var(--bordo);margin:10px 0 4px}
.lcard input{width:100%;border:1px solid #dfb6c7;border-radius:8px;padding:10px;font:inherit}
.lcard button.go{width:100%;margin-top:16px;border:0;border-radius:9px;padding:12px;font:bold 14px Arial;background:var(--bordo);color:#fff;cursor:pointer}
.lcard button.go:disabled{opacity:.6}.lcard .lk{background:none;border:0;color:var(--bordo);font-size:12px;margin-top:10px;cursor:pointer;text-decoration:underline;padding:0}
.lerr{margin-top:10px;font-size:12px;font-weight:bold;color:#9c102d;min-height:16px}
.banner{background:#fff0c2;color:#765100;font-size:12px;font-weight:bold;padding:7px 14px;border-bottom:1px solid #edce64}
@media print{.tabs,.banner{display:none}.stage{position:static}}
</style></head><body>
<div class="login" id="login" hidden>
  <form class="lcard" id="lform">
    <h1>Painel Operacional</h1><p>Entre com o e-mail e a senha cadastrados pelo administrador.</p>
    <label for="lem">E-mail</label><input id="lem" type="email" autocomplete="username" required>
    <label for="lpw">Senha</label><input id="lpw" type="password" autocomplete="current-password" required>
    <button class="go" id="lgo" type="submit">Entrar</button>
    <button class="lk" id="lfg" type="button">Esqueci minha senha</button>
    <div class="lerr" id="lerr" role="alert"></div>
  </form>
</div>
<div class="banner" id="banner" hidden></div>
<div class="tabs" role="tablist" id="tabs" hidden>
  <b>PAINEL OPERACIONAL</b>
  <button class="tab on" role="tab" id="t1" data-t="1" aria-selected="true">Régua Operacional EPS <i id="c1">0</i></button>
  <button class="tab" role="tab" id="t2" data-t="2" aria-selected="false">ABS Próprio <i id="c2">0</i></button>
  <span class="who"><span id="whoMail"></span><span class="role" id="whoRole"></span><button class="lbtn" id="lout" type="button">Sair</button></span>
</div>
<div class="stage" id="stage" hidden>
  <iframe id="f1" title="Régua Operacional EPS"></iframe>
  <iframe id="f2" title="ABS Próprio" hidden></iframe>
</div>
<div class="flash" id="flash" hidden></div>

on class=\"screen active\" id=\"vR\">\n  <div class=\"base-panel\">\n    <div class=\"fl\"><label for=\"fileImp\">Base de dados (Excel ou CSV)<\/label><input id=\"fileImp\" type=\"file\" accept=\".xlsx,.xls,.xlsm,.csv\"><\/div>\n    <button class=\"primary\" id=\"bImp\" type=\"button\" title=\"A planilha precisa ter as colunas DATA, HORA, REC, Eps e Cel\">Carregar base<\/button>\n    <button class=\"secondary\" id=\"bBaseRst\" type=\"button\" hidden>Voltar à base original<\/button>\n    <span class=\"note\" id=\"baseInfo\"><\/span>\n  <\/div>\n  <div class=\"filters\">\n    <div><label for=\"fDate\">Data<\/label><select id=\"fDate\"><\/select><\/div>\n    <div><label for=\"fHour\">Hora<\/label><select id=\"fHour\"><\/select><\/div>\n    <div><label for=\"fCell\">Régua / célula<\/label><select id=\"fCell\"><\/select><\/div>\n    <div><label for=\"fEps\">EPS (opcional)<\/label><select id=\"fEps\"><\/select><\/div>\n    <button class=\"primary\" id=\"bUpd\" type=\"button\">Atualizar<\/button>\n    <button class=\"yellow\" id=\"bSave\" type=\"button\" title=\"Valida os logados e salva um registro permanente desta régua\">Salvar registro<\/button>\n  <\/div>\n  <div id=\"msg\" class=\"alert\" role=\"alert\" hidden><\/div>\n  <div class=\"summary\" id=\"kpis\"><\/div>\n  <div class=\"section-title\"><h2>Régua operacional<\/h2><span class=\"note\">Preencha os logados reais; o delta é calculado automaticamente (Logados − Escalados).<\/span><\/div>\n  <div id=\"tbl\"><\/div>\n  <div class=\"table-actions\">\n    <button class=\"orange\" id=\"bExpR\" type=\"button\">Baixar régua em Excel<\/button>\n    <button class=\"secondary\" id=\"bPrintSel\" type=\"button\">Imprimir régua atual<\/button>\n    <button class=\"primary\" id=\"bPrintAll\" type=\"button\">Print da régua completa<\/button>\n  <\/div>\n  <div class=\"legend\">\n    <span><i class=\"dot d-def\"><\/i>GAP negativo: faltam logados<\/span><span><i class=\"dot d-ok\"><\/i>GAP zero: em linha<\/span><span><i class=\"dot d-exc\"><\/i>GAP positivo: logados acima do escalado<\/span><span><i class=\"dot\"><\/i>Não preenchido / sem escala<\/span>\n  <\/div>\n  <p class=\"note\">O histórico é registrado automaticamente sempre que você atualiza o painel. Para guardar uma versão validada, preencha todos os logados e clique em Salvar registro. Campo vazio não é tratado como zero.<\/p>\n<\/section>\n\n<\!-- ================= HISTÓRICO ================= -->\n<section class=\"screen\" id=\"vH\">\n  <div class=\"section-title\"><h2>Histórico de atualizações<\/h2><span class=\"note\" id=\"hCount\"><\/span><\/div>\n  <div class=\"filters\" style=\"grid-template-columns:repeat(4,minmax(120px,1fr)) auto auto\">\n    <div><label for=\"hDate\">Filtrar por data<\/label><select id=\"hDate\"><\/select><\/div>\n    <div><label for=\"hHour\">Hora<\/label><select id=\"hHour\"><\/select><\/div>\n    <div><label for=\"hCell\">Régua<\/label><select id=\"hCell\"><\/select><\/div>\n    <div><label for=\"hEps\">EPS<\/label><select id=\"hEps\"><\/select><\/div>\n    <button class=\"orange\" id=\"bExpH\" type=\"button\" title=\"Exporta os registros exibidos conforme os filtros\">Baixar histórico Excel<\/button>\n    <button class=\"danger\" id=\"bClr\" type=\"button\">Excluir histórico<\/button>\n  <\/div>\n  <div class=\"tablewrap\"><table><thead><tr><th>Atualizado em<\/th><th>Data escala<\/th><th>Hora<\/th><th>Régua<\/th><th>EPS<\/th><th class=\"r\">Escalados<\/th><th class=\"r\">Logados<\/th><th class=\"r\">Delta / GAP<\/th><th>Status<\/th><\/tr><\/thead><tbody id=\"hBody\"><\/tbody><\/table><\/div>\n  <p class=\"note\">O histórico é armazenado neste navegador (armazenamento local do HTML) e não é compartilhado entre computadores. Exporte o Excel para guardar uma cópia externa. Limpar os dados do navegador pode apagar esse histórico.<\/p>\n<\/section>\n\n<\!-- ================= REGISTROS ================= -->\n<section class=\"screen\" id=\"vG\">\n  <div class=\"section-title\"><h2>Registros salvos<\/h2><span class=\"note\" id=\"gCount\"><\/span><\/div>\n  <div class=\"filters\" style=\"grid-template-columns:repeat(4,minmax(120px,1fr)) auto\">\n    <div><label for=\"gView\">Visualização<\/label><select id=\"gView\"><option value=\"eps\">Separado por EPS<\/option><option value=\"rec\">Por registro<\/option><\/select><\/div>\n    <div><label for=\"gDate\">Data<\/label><select id=\"gDate\"><\/select><\/div>\n    <div><label for=\"gEps\">EPS<\/label><select id=\"gEps\"><\/select><\/div>\n    <div><label for=\"gQ\">Buscar (ID ou régua)<\/label><input id=\"gQ\" type=\"search\" placeholder=\"Ex.: REG-20261019\"><\/div>\n    <button class=\"orange\" id=\"bExpG\" type=\"button\" title=\"Exporta os registros exibidos conforme os filtros\">Baixar registros Excel<\/button>\n  <\/div>\n  <div class=\"selbar\" id=\"selBar\">\n    <button class=\"secondary\" id=\"gSelAll\" type=\"button\" aria-pressed=\"false\">Selecionar todos<\/button>\n    <button class=\"danger\" id=\"gDelSel\" type=\"button\" disabled>Excluir selecionados (0)<\/button>\n    <button class=\"secondary\" id=\"gDelAll\" type=\"button\" title=\"Exclui todos os registros, após confirmação\">Excluir todos os registros<\/button>\n    <span class=\"sinfo\" id=\"selInfo\">Nenhum registro selecionado<\/span>\n  <\/div>\n  <div id=\"gHost\"><\/div>\n  <p class=\"note\">Os registros salvos ficam guardados neste navegador (armazenamento local) e não são compartilhados automaticamente entre computadores. Use o Excel para guardar uma cópia.<\/p>\n<\/section>\n<\/main>\n\n<div id=\"pv\" aria-hidden=\"true\">\n  <div class=\"pvbar\"><b id=\"pvTitle\">Prévia de impressão<\/b>\n    <button class=\"yellow\" id=\"pvPrint\" type=\"button\">Imprimir / salvar PDF<\/button>\n    <button class=\"secondary\" id=\"pvClose\" type=\"button\">Fechar<\/button><\/div>\n  <div class=\"pvpage\" id=\"pvPage\"><\/div>\n<\/div>\n<dialog id=\"dlg\"><p id=\"dlgMsg\"><\/p><div class=\"row\"><button class=\"secondary\" id=\"dlgNo\" type=\"button\">Cancela var TABLES={'regua_eps_registros_v1':'regua_registros','absProprioManualHistoryV1':'abs_registros'};
var LOCAL=SUPABASE_URL.indexOf('COLE_AQUI')===0||!window.supabase;
var $=function(i){return document.getElementById(i)};
var sb=null,me=null,canEdit=false,cache={},q=Promise.resolve(),mounted=false,pollT=null;

function flash(msg,err){var f=$('flash');f.textContent=msg;f.className='flash'+(err?' err':'');f.hidden=false;clearTimeout(flash.t);flash.t=setTimeout(function(){f.hidden=true},err?6500:3200)}
function cnt(k){return (cache[k]||[]).length}
function upd(){
  if(LOCAL){var g=function(k){try{var v=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(v)?v.length:0}catch(e){return 0}};$('c1').textContent=g('regua_eps_registros_v1');$('c2').textContent=g('absProprioManualHistoryV1')}
  else{$('c1').textContent=cnt('regua_eps_registros_v1');$('c2').textContent=cnt('absProprioManualHistoryV1')}
}

/* ---------- ponte de armazenamento: as duas telas continuam usando localStorage, que aqui vira o banco ---------- */
window.__shared={
  keys:TABLES,
  get:function(k){return JSON.stringify(cache[k]||[])},
  set:function(k,v){
    if(!canEdit){flash('Seu acesso é somente visualização: a alteração não foi salva.',true);throw new Error('somente visualização')}
    var arr=JSON.parse(v);if(!Array.isArray(arr))throw new Error('formato inválido');
    push(k,arr);upd();
  }
};
function push(k,arr){
  var old=cache[k]||[],t=TABLES[k],om={},nm={},up=[];
  old.forEach(function(x){om[x.id]=JSON.stringify(x)});
  arr.forEach(function(x){nm[x.id]=1;if(om[x.id]!==JSON.stringify(x))up.push({id:x.id,dados:x,atualizado_por:me.email})});
  var del=old.filter(function(x){return !nm[x.id]}).map(function(x){return x.id});
  cache[k]=arr;
  q=q.then(function(){return up.length?sb.from(t).upsert(up):{error:null}}).then(function(r){if(r.error)throw r.error;return del.length?sb.from(t).delete().in('id',del):{error:null}}).then(function(r){if(r.error)throw r.error})
   .catch(function(e){flash('Não foi possível salvar no servidor ('+(e.message||e)+'). Os dados foram recarregados.',true);return loadAll(true)});
}
async function loadAll(refresh){
  var changed=false;
  for(var k in TABLES){
    var r=await sb.from(TABLES[k]).select('dados').order('criado_em',{ascending:true}).limit(10000);
    if(r.error){flash('Erro ao carregar dados: '+r.error.message,true);continue}
    var arr=r.data.map(function(x){return x.dados}),a=JSON.stringify(arr);
    if(a!==JSON.stringify(cache[k]||[])){cache[k]=arr;changed=true}
  }
  upd();if(changed&&refresh&&mounted)refreshViews();
}
function refreshViews(){
  try{var w=$('f1').contentWindow;if(w&&w.renderReg){w.REG=cache['regua_eps_registros_v1']||[];w.updRegCnt&&w.updRegCnt();w.regSetup&&w.regSetup();w.renderReg()}}catch(e){}
  try{var w2=$('f2').contentWindow;if(w2&&w2.renderHistory)w2.renderHistory()}catch(e){}
}

  var s='(function(){var P=window.parent.__shared,K=P.keys,gi=Storage.prototype.getItem,si=Storage.prototype.setItem,ri=Storage.prototype.removeItem;'+
   'Storage.prototype.getItem=function(k){return(this===window.localStorage&&K[k])?P.get(k):gi.call(this,k)};'+
   'Storage.prototype.setItem=function(k,v){if(this===window.localStorage&&K[k])return P.set(k,v);return si.call(this,k,v)};'+

  return '<script>'+s+'<\/script>';
}
var VIEW_CSS='<style>#bSave,#selBar,.ac [data-a="del"],.ac [data-a="delline"],.rk,#saveBtn,#clearHistoryBtn,#clearFormBtn,[data-delete]{display:none!important}.mc{pointer-events:none}'+

  return h.replace('<head>','<head>'+shim()+(canEdit?'':VIEW_CSS));
}
function mount(){
  $('f1').srcdoc=build(1);$('f2').srcdoc=build(2);mounted=true;

function lockViewer(fr){ // somente leitura também nos campos de preenchimento do ABS
  try{var d=fr.contentDocument;[].forEach.call(d.querySelectorAll('.fieldnum,textarea,#reportDate,#reportTime'),function(e){e.readOnly=true})}catch(e){}
}
function show(k){
  ['1','2'].forEach(function(j){var on=j===k;$('f'+j).hidden=!on;var b=$('t'+j);b.classList.toggle('on',on);b.setAttribute('aria-selected',String(on))});
  try{sessionStorage.setItem('painel_tab',k)}catch(e){}
  try{$('f'+k).contentWindow.focus()}catch(e){}
}
$('tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(b)show(b.dataset.t)});

function enter(){
  $('login').hidden=true;$('tabs').hidden=false;$('stage').hidden=false;
  $('whoMail').textContent=me?me.email:'';
  var r=$('whoRole');r.textContent=canEdit?'Editor':'Somente visualização';r.className='role '+(canEdit?'ed':'vi');
  if(LOCAL){$('lout').hidden=true;$('whoMail').textContent='';r.hidden=true;var b=$('banner');b.hidden=false;b.textContent='Modo local: o Supabase ainda não foi configurado, então os registros ficam só neste navegador. Preencha SUPABASE_URL e SUPABASE_ANON_KEY no topo do script para ativar o compartilhamento.'}
  mount();upd();

  if(!LOCAL){clearInterval(pollT);pollT=setInterval(function(){if(!document.hidden)loadAll(true)},20000);
    document.addEventListener('visibilitychange',function(){if(!document.hidden)loadAll(true)})}
  else setInterval(upd,1500);
}
async function afterLogin(user){
  me=user;
  var p=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();
  canEdit=!!(p.data&&p.data.role==='editor');
  await loadAll(false);enter();
}
$('lform').addEventListener('submit',async function(e){
  e.preventDefault();var b=$('lgo');b.disabled=true;$('lerr').textContent='';
  var r=await sb.auth.signInWithPassword({email:$('lem').value.trim(),password:$('lpw').value});
  b.disabled=false;
  if(r.error){$('lerr').textContent=/Invalid login/i.test(r.error.message)?'E-mail ou senha incorretos.':'Não foi possível entrar: '+r.error.message;return}
  $('lpw').value='';afterLogin(r.data.user);
});
$('lfg').addEventListener('click',async function(){
  var m=$('lem').value.trim();if(!m){$('lerr').textContent='Digite seu e-mail acima e clique novamente.';return}
  var r=await sb.auth.resetPasswordForEmail(m,{redirectTo:location.href.split('#')[0]});
  $('lerr').style.color=r.error?'#9c102d':'#126b51';$('lerr').textContent=r.error?r.error.message:'Enviamos um link de redefinição para o seu e-mail.';
});

(async function init(){
  if(LOCAL){enter();return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  if(!REQUIRE_LOGIN){me={email:'acesso aberto'};canEdit=true;await loadAll(false);enter();$('lout').hidden=true;$('whoMail').textContent='';$('whoRole').hidden=true;var bn=$('banner');bn.hidden=false;bn.textContent='Acesso aberto: qualquer pessoa com o link pode ver e editar os registros. Não divulgue o endereço fora da equipe até configurar os acessos.';return}
  var s=await sb.auth.getSession();
  if(s.data&&s.data.session)afterLogin(s.data.session.user);else $('login').hidden=false;
})();
